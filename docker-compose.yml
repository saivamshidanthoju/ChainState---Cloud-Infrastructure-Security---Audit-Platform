version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: chainstate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chainstate
      POSTGRES_PASSWORD: chainstate_secure_pass
      POSTGRES_DB: chainstate_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainstate -d chainstate_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chainstate-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DEMO_MODE=true
      - DATABASE_URL=postgresql://chainstate:chainstate_secure_pass@postgres:5432/chainstate_db
      - JWT_SECRET_KEY=chainstate_dev_jwt_secret_key_8492049281749201948291
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chainstate-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000

volumes:
  postgres_data:
